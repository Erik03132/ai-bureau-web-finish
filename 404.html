<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, follow" />
    <title>Страница не найдена — AI Bureau</title>
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap");

      :root {
        --ink: #0f172a;
        --ink-soft: #425066;
        --muted: #667085;
        --line: #dbe1e8;
        --paper: #f7f8f6;
        --white: #ffffff;
        --signal: #c8ef67;
        --max: 760px;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        padding: 0;
        overflow-x: clip;
      }

      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 48px 24px;
        background: var(--paper);
        color: var(--ink);
        font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .card {
        width: 100%;
        max-width: var(--max);
        background: var(--white);
        border: 1px solid var(--line);
        border-radius: 24px;
        padding: 56px 40px;
        text-align: center;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.14em;
        color: var(--ink);
        text-decoration: none;
      }

      .brand-mark {
        width: 26px;
        height: 26px;
        border-radius: 8px;
        background: var(--signal);
        display: inline-block;
      }

      .code {
        margin: 36px 0 8px;
        font-size: clamp(64px, 14vw, 120px);
        line-height: 1;
        font-weight: 800;
        letter-spacing: -0.04em;
        color: var(--ink);
      }

      h1 {
        margin: 0 0 14px;
        font-size: clamp(22px, 3vw, 30px);
        line-height: 1.25;
        font-weight: 700;
      }

      p {
        margin: 0 auto 32px;
        max-width: 46ch;
        font-size: 17px;
        line-height: 1.6;
        color: var(--ink-soft);
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        justify-content: center;
      }

      .button {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 14px 24px;
        border-radius: 999px;
        font-size: 15px;
        font-weight: 600;
        text-decoration: none;
        border: 1px solid transparent;
        transition: opacity 0.2s ease;
      }

      .button-dark {
        background: var(--ink);
        color: var(--white);
      }

      .button-light {
        background: transparent;
        color: var(--ink);
        border-color: var(--line);
      }

      .button:hover { opacity: 0.85; }

      .button:focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: 3px;
      }

      .brand:focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: 4px;
        border-radius: 8px;
      }

      .hint {
        margin: 28px 0 0;
        font-size: 14px;
        color: var(--muted);
      }

      @media (max-width: 520px) {
        .card { padding: 40px 22px; border-radius: 18px; }
      }

      @media (prefers-reduced-motion: reduce) {
        .button { transition: none; }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <a class="brand" href="/" aria-label="AI Bureau — на главную">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>AI BUREAU</span>
      </a>
      <div class="code" aria-hidden="true">404</div>
      <h1>Такой страницы нет</h1>
      <p>
        Возможно, ссылка устарела или в адресе опечатка. Ниже — рабочие входы:
        главная со всеми услугами и прямой контакт в Telegram.
      </p>
      <div class="actions">
        <a class="button button-dark" href="/">На главную <span aria-hidden="true">→</span></a>
        <a class="button button-light" href="https://t.me/erik03132">Написать в Telegram</a>
      </div>
      <p class="hint">Нужна конкретная услуга? Она есть в разделе «Услуги» на главной.</p>
    </main>
  </body>
</html>
